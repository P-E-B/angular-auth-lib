<div id="container" [style.background-image]="'url(' + images.loginBackgroundImageUrl + ')'">
  <mat-card class="mat-elevation-z8">
    <mat-card-content>
      @if (images.logoImageUrl && images.logoImageUrl.length >= 1) {
        <img [src]="images.logoImageUrl" alt="logo">
      }
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

        <mat-form-field>
          <mat-label>{{ usernamePlaceholder }}</mat-label>
          <input matInput formControlName="username" autocomplete="username">
        </mat-form-field>

        <mat-form-field>
          <mat-label>{{ passwordPlaceholder }}</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password">
        </mat-form-field>

        @if (!isPasswordBeingChanged() && !isLoginLoading()) {
          <button
            mat-raised-button
            type="submit"
            [disabled]="userForm.invalid"
            [style.background-color]="buttonsBackgroundColor"
            [style.color]="buttonsColor"
          >
            {{ loginButtonTraduction }}
          </button>
        } @else {
          <mat-progress-spinner mode="indeterminate" [diameter]="36"></mat-progress-spinner>
        }

        <button type="button" mat-button (click)="openDialog()">{{ forgottenPassword }}</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
