<div id="container">
    <h2 mat-dialog-title>{{ signUpDialogTitle }}</h2>
    <form [formGroup]="userForm" (ngSubmit)="onSubmitUser()">

        <div id="columns">
            <div id="left-column">
                <mat-form-field>
                    <mat-label>{{ usernamePlaceholder }}</mat-label>
                    <input matInput formControlName="username" autocomplete="off">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>{{ firstNamePlaceholder }}</mat-label>
                    <input matInput formControlName="firstName" autocomplete="off">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>{{ emailPlaceholder }}</mat-label>
                    <input matInput formControlName="email" autocomplete="off">
                </mat-form-field>
            </div>

            <div id="right-column">
                <mat-form-field>
                    <mat-label>{{ passwordPlaceholder }}</mat-label>
                    <input matInput type="password" formControlName="password" autocomplete="off">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>{{ lastNamePlaceholder }}</mat-label>
                    <input matInput formControlName="lastName" autocomplete="off">
                </mat-form-field>
                <mat-form-field>
                    <mat-label>{{ enterprisePlaceholder }}</mat-label>
                    <input matInput formControlName="enterprise" autocomplete="off">
                </mat-form-field>
            </div>
        </div>

        @if (isSignUpLoading()) {
            <mat-spinner [diameter]="36"></mat-spinner>
        } @else {
            <button
                mat-raised-button
                type="submit"
                [disabled]="userForm.invalid"
                [style.background-color]="buttonsBackgroundColor"
                [style.color]="buttonsColor"
            >
                {{ signupButtonTraduction }}
            </button>
        }
    </form>
</div>
