<mat-form-field>
  <mat-label>{{ emailPlaceholder }}</mat-label>
  <input matInput type="email" autocomplete="email" [formControl]="email">
</mat-form-field>

<button
  mat-raised-button
  type="button"
  (click)="send()"
  [disabled]="email.invalid"
  [style.background-color]="buttonsBackgroundColor"
  [style.color]="buttonsColor"
>
  {{ sendButtonTraduction }}
</button>
